// ---- flow -----------------------------------------------------------------------------------
function go(next) { cur = next; render(); screenEl.focus({ preventScroll: true }); if (!document.body.classList.contains("wide")) window.scrollTo({ top: 0 }); }

function playStep(i, replay) {
  const st = STEPS[i];
  if (!st) return go({ type: "results" });
  if (st.chapter) enterChapter(st.chapter);
  if (st.kind === "story") return go({ type: "story", pages: { PROLOGUE, PORTAL, EPILOGUE, EPILOGUE2, EPILOGUE3 }[st.pages], index: 0, stepIndex: i });
  if (st.kind === "test") return startTest(st.test, i);
  if (st.kind === "battle") return startBattle(st.enc, i, replay);
  if (st.kind === "treasure") return go({ type: "treasure", stepIndex: i });
  // "@pairs" is not a dialogue from data/: it is the review page of the look-alike letters.
  if (st.kind === "restore") return go({ type: "restore", stepIndex: i, index: 0, replay });
  if (st.kind === "convo") return go({ type: "convo", stepIndex: i, phase: "learn", li: 0, ei: 0, first: 0, tries: 0, replay });
  const lines = st.dlg.flatMap((id) => (id[0] === "@" ? [{ speaker: "kenji", special: id.slice(1) }] : DIALOGUES[id] || PROTO_DIALOGUES[id] || []));
  go({ type: "dialogue", lines, index: 0, scene: stepScene(i), stepIndex: i, replay });
  setFlag();
}
function finishStep(i) { if (S.step <= i) { S.step = i + 1; skipShortSteps(); save(); } }
// v20: the test session (30-40 minutes): the same lessons and tests with fewer battles (see mode_short_note).
const SHORT_HP = 0.6;
function setShortMode(on) { S.shortMode = !!on; skipShortSteps(); save(); }
function skipShortSteps() { while (S.shortMode && STEPS[S.step] && STEPS[S.step].skipShort) { S.flags["skip_" + STEPS[S.step].id] = true; S.step += 1; } }
function nextStepIndex(i) { let j = i + 1; while (S.shortMode && STEPS[j] && STEPS[j].skipShort) j += 1; return j; }
// After step i: the next step plays right away when it happens at the same place,
// otherwise the player goes back to the map and walks there.
function advanceFrom(i) {
  finishStep(i);
  if (STEPS[i].then === "results") return go({ type: "results" });
  const j = nextStepIndex(i), next = STEPS[j];
  if (!next) return go({ type: "results" });
  if (next.station === STEPS[i].station) return playStep(j);
  go({ type: "map" });
}
function storyNext() {
  if (cur.index < cur.pages.length - 1) { cur.index += 1; sfx("page"); return render(); }
  advanceFrom(cur.stepIndex);
}

function setFlag() {
  const line = cur.lines[cur.index];
  if (line && line.set_flag) { S.flags[line.set_flag] = true; save(); }
}
// A line whose Japanese is a row of single kana ("あ い う え お") introduces those letters:
// the next press opens one card per letter, then the dialogue goes on.
function kanaOfLine(line) {
  if (line.nocards) return null;
  const ja = (line.ja || "").trim();
  if (!/^[ぁ-ゖ](\s+[ぁ-ゖ])*$/.test(ja) && !/^[ァ-ヶ](\s+[ァ-ヶ])*$/.test(ja) && !/^[\u4e00-\u9fff](\s+[\u4e00-\u9fff])*$/.test(ja)) return null;
  const ids = ja.split(/\s+/).map((k) => ITEM_ORDER.find((id) => ITEMS[id].kana === k)).filter(Boolean);
  return ids.length ? ids : null;
}
function dialogueBack() {
  if (cur.note) { cur.cards = { ids: cur.note.ids, index: cur.note.ids.length - 1 }; cur.note = null; return go(cur); }
  if (!cur.cards) return;
  if (cur.cards.index > 0) cur.cards.index -= 1; else cur.cards = null;
  go(cur);
}
function dialogueNext() {
  if (cur.cards) {
    if (cur.cards.index < cur.cards.ids.length - 1) { cur.cards.index += 1; sfx("page"); return go(cur); }
    // After the last card: the notebook page with the whole row, then a check of the new letters.
    cur.note = { ids: cur.cards.ids };
    cur.cards = null;
    return go(cur);
  }
  if (cur.note) { const ids = cur.note.ids; cur.note = null; return startCheck(ids, cur); }
  const ids = kanaOfLine(cur.lines[cur.index]);
  if (ids) { cur.cards = { ids, index: 0 }; sfx("page"); return go(cur); }
  dialogueOn();
}
function dialogueOn() {
  if (cur.index < cur.lines.length - 1) { cur.index += 1; setFlag(); go(cur); return; }
  if (cur.replay) return go({ type: "map" });
  advanceFrom(cur.stepIndex);
}

// The battle: answer to hit, a wrong answer or a slow one lets the enemy hit you.
// The same letter asked three ways: read it (kana → reading), write it (reading → kana),
// hear it (sound → kana). New letters are only read; the other ways come with the boxes.
function pickDir(id) {
  const box = S.quiz[id] ? S.quiz[id].box : 0, r = Math.random(), voice = canSpeak();
  if (box <= 1) return "read";
  if (box === 2) return r < 0.6 ? "read" : voice && r < 0.8 ? "listen" : "write";
  return r < 0.34 ? "read" : voice && r < 0.67 ? "listen" : "write";
}
// Keeps the engine's question (same item, same wrong readings) and only turns it around.
// v22: a kanji is asked by its meaning; each meaning goes back to the engine (and the log) as its kanji's reading.
function meaningQuestion(q) {
  const item = ITEMS[q.item_id], toReading = {};
  for (const r of q.choices) {
    const id = r === item.romaji ? item.id : ITEM_ORDER.find((x) => ITEMS[x].script === "kanji" && ITEMS[x].romaji === r);
    if (id) toReading[L(ITEMS[id].meaning)] = r;
  }
  return Object.assign(q, { dir: "mean", kanji: true, prompt_text: item.kana, choices: Object.keys(toReading), toReading, answer: L(item.meaning) });
}
function shapeQuestion(q, dir) {
  if (!q.word && ITEMS[q.item_id] && ITEMS[q.item_id].script === "kanji") return meaningQuestion(q);
  if (q.word || dir === "read") return Object.assign(q, { dir: "read", answer: q.expected || ITEMS[q.item_id].romaji });
  const item = ITEMS[q.item_id], toReading = {};
  for (const r of q.choices) {
    const id = r === item.romaji ? item.id : ITEM_ORDER.find((x) => ITEMS[x].script === item.script && ITEMS[x].romaji === r);
    if (id) toReading[ITEMS[id].kana] = r;
  }
  return Object.assign(q, { dir, prompt_text: dir === "write" ? item.romaji : item.kana, choices: Object.keys(toReading), toReading, answer: item.kana });
}
// The engine only knows readings: a letter chosen in "write" or "listen" goes back as its reading.
function submitShaped(engine, q, chosen) { return engine.submit(q.qid, q.toReading ? q.toReading[chosen] : chosen); }
function engineQuiz(engine, dirs) {
  return { engine, next: () => { const q = engine.nextQuestion(); return shapeQuestion(q, dirs ? pickDir(q.item_id) : "read"); }, submit: (q, chosen) => submitShaped(engine, q, chosen) };
}
// Right after Kenji's cards: each new letter once, the missed ones again at the end, no hearts.
function lessonQuiz(ids) {
  const engine = new QuizEngine(S.quiz), queue = shuffle(ids.slice());
  engine.startIds(ids);
  return {
    engine,
    next: () => shapeQuestion(engine.askItem(queue.shift()), "read"),
    submit(q, chosen) { const res = submitShaped(engine, q, chosen); if (res && !res.correct) queue.push(q.item_id); return res; },
    done: () => !queue.length,
  };
}
function startCheck(ids, back) {
  const quiz = lessonQuiz(ids), pool = ({ kata: "c2_row_", kanji: "c3_row_" }[ITEMS[ids[0]].script] || "c1_row_") + ITEMS[ids[0]].row;
  go({ type: "battle", practice: true, check: true, rowPool: POOLS[pool] ? pool : "", quiz, encId: "", title: t("check_title", { row: rowName(ITEMS[ids[0]]) }), combo: 0, correct: 0, wrong: 0,
    answered: 0, log: [], q: quiz.next(), shownAt: performance.now(), resume: back });
}
// The review: letters already taught, the ones in box 1 most often; now and then a word.
function reviewQuiz(opts) {
  const rows = learnedRows();
  const kana = ITEM_ORDER.filter((id) => id[0] === "h" && rows.includes(ITEMS[id].row));
  const engine = new QuizEngine(S.quiz);
  engine.startIds(kana.length ? kana : POOLS.c1_row_a);
  let last = "", n = 0;
  const weight = (id) => { const e = S.quiz[id], base = id === last ? 0 : !e ? 3 : e.box === 1 ? 4 : e.box === 2 ? 2 : 1; return isDue(id) ? base * 3 : base; };
  return {
    engine,
    next() {
      const words = readableWords();
      if (words.length >= 2 && (opts.wordsOnly || (words.length >= 4 && Math.random() < 0.35))) return wordQuestion(words, last, () => (last = ""));
      let total = 0;
      const ws = engine.pool.map((id) => { const w = weight(id); total += w; return w; });
      let r = Math.random() * total, pick = engine.pool[0];
      for (let i = 0; i < ws.length; i++) { r -= ws[i]; if (r <= 0) { pick = engine.pool[i]; break; } }
      last = pick; n += 1;
      return shapeQuestion(engine.askItem(pick), pickDir(pick));
    },
    submit(q, chosen) { return q.word ? submitWord(q, chosen) : submitShaped(engine, q, chosen); },
  };
}
let wordQid = 1;
function wordQuestion(words, lastId) {

  c.combo = 0; c.anim = "attack"; c.animAt = performance.now(); c.shotFx = null; c.pop = null; c.missFx = ""; c.shotX = null;
  const a = foeAction(c, "attack", { special: pickSpecial(c) });

function battleAnswer(i) {

  const chosen = c.q.choices[i];
  if (c.removed && c.removed.includes(chosen)) return;
  const elapsed = Math.round(performance.now() - c.shownAt);
  const res = c.quiz.submit(c.q, chosen);
  if (!res) return;
  if (c.review) c.answered += 1;
  const reading = c.q.toReading ? c.q.toReading[chosen] : chosen;
  logEvent("answer", { encounter_id: c.encId, qid: c.q.qid, item_id: c.q.item_id, mode: "choice", correct: res.correct, elapsed_ms: elapsed, chosen: reading });
  noteAnswer(c.q, res.correct, chosen);
  save();
  const shown = c.q.word ? c.q.prompt_text : ITEMS[c.q.item_id].kana;
  c.fb = { correct: res.correct, expected: res.expected, answer: c.q.answer || res.expected, chosen, kana: shown, explain: res.explain };
  const vars = { kana: `<span lang="ja">${esc(shown)}</span>`, exp: esc(res.expected), chosen: c.q.toReading ? `<span lang="ja">${esc(chosen)}</span>` : esc(chosen),

    const extra = c.q.word ? [{ text: L(res.explain), cls: "meaning" }] : [];
    if (c.practice) { sfx("correct"); c.log = [{ html: t("right_fb", vars), cls: "ok" }].concat(extra); newQuestion(); if (c.finished) finishReview(); return render(); }
    // Three right answers in a row: a critical hit. Fire strike triples the next hit.

    const lucky = !c.boost && c.combo < 3 && !c.train && roll("lucky", 0.08);
    const mult = c.boost ? 3 : c.combo >= 3 || lucky ? 2 : 1, peeked = c.peekQ === c.q.qid, damage = peeked ? Math.max(1, (mult * HIT) / 2) : mult * HIT;
    // Now and then the foe dodges even a right answer, as in Dragon Quest: no damage, but the answer counts as right

    if (mult === 1 && !c.foe.still && !c.lastEvade && roll("evade", CHANCE.evade)) {

      c.log = [{ html: t("right_fb", vars), cls: "ok" }, { text: t("evaded", { name: foeName(c.encId) }), cls: "muted" }].concat(extra);
      sfx("shot"); foeSfx(c, "dodge", 150);
      if (c.frozen > 0) c.frozen -= 1;
      newQuestion();
      return render();
    }
    c.lastEvade = false;
    c.boost = false;
    c.ki = Math.min(c.maxKi, c.ki + 1);
    c.hp = Math.max(0, c.hp - damage);
    c.anim = "hurt"; c.animAt = performance.now();
    // A right answer always hits. Sometimes the foe tries to get away, but the letter follows it.
    const a = foeAction(c, "hurt", { tryDodge: !c.foe.still && Math.random() < 0.3, crit: mult > 1 });
    c.shotX = a.to;
    c.shotFx = { text: shown, crit: mult > 1 };
    c.pop = { text: mult > 1 ? t("crit", { n: damage }) : "-" + damage, cls: mult > 1 ? "crit" : peeked ? "weak" : "" };
    c.log = [{ html: t("right_fb", vars), cls: "ok" }].concat(extra);
    if (peeked) c.log.push({ text: t("peek_weak"), cls: "muted" });
    if (lucky) c.log.push({ text: t("lucky"), cls: "reward" });
    if (mult > 1 && c.kenji) c.log.push({ html: `<b>Kenji-sensei:</b> ${esc(t("kenji_cheer"))}`, cls: "kenji" });
    sfx("shot");
    setTimeout(() => sfx(mult > 1 ? "crit" : "impact"), 290);
    if (c.hp <= 0) return endBattle("win");
    if (c.foe.phase2Ratio && c.phase === 1 && c.hp <= c.maxHp * c.foe.phase2Ratio && c.enc && c.enc.phase2_pool_id) {
      c.phase = 2;
      c.phaseAt = performance.now() + 650;
      c.quiz.engine.start(c.enc.phase2_pool_id);
      c.log.push({ text: t(POOLS[c.enc.phase2_pool_id].some((id) => ITEMS[id].script === "kanji") ? "kj_phase2" : "phase2", { foe: foeShort(c.encId) }), cls: "reward" });
      sfx("phase");
      setTimeout(() => { if (cur === c && !c.over) { foeAction(c, "roar"); sfx("roar"); } }, REDUCED_MOTION ? 0 : 650);
    }
    if (c.frozen > 0) c.frozen -= 1;

  c.wrong += 1; c.combo = 0; c.locked = true;
  const trick = L(res.explain);

  const turned = c.q.dir === "write" || c.q.dir === "listen";
  const dodge = !c.practice && !c.train && roll("heroDodge", CHANCE.heroDodge);
  const key = c.train ? "train_wrong" : c.practice ? (turned ? "wrong_fb_k" : "quiz_wrong") : (turned ? "wrong_fb_k_hit" : "wrong_fb") + (dodge ? "_dodged" : "");

  c.log = [{ html: t(key, vars), cls: "bad" }].concat(tip ? [tip] : []);
  sfx("wrong");
  if (!c.practice && !c.train) {
    // The letter misses: the foe sidesteps, then hits back (with its own move now and then). The hero may dodge.
    c.heroDodge = dodge;
    if (!dodge) c.hearts -= 1;
    c.anim = "dodge"; c.animAt = performance.now();
    const a = foeAction(c, "dodge", { special: pickSpecial(c) });
    c.special = a.special;
    if (a.special) c.log.splice(1, 0, specialLine(c, a.special));
    c.shotX = a.from; c.missFx = shown;
    const hit = DODGE_LEAD + (a.special ? SPECIAL_HIT : ATK_HIT);
    if (REDUCED_MOTION) setTimeout(() => sfx(dodge ? "evade" : "hit"), 330);
    else {
      foeSfx(c, "dodge", 170);
      foeSfx(c, a.special ? "charge" : "lunge", DODGE_LEAD + (a.special ? 60 : 150));
      if (a.special) foeSfx(c, a.special, hit - 220);
      foeSfx(c, dodge ? "evade" : "hit", hit);

}
// Pages in the battle's log: from the page the player is on, the paragraphs that do not fit wait for the next page.

  const ps = [...log.children];
  ps.forEach((p, i) => { p.hidden = i < c.logPage; });
  let last = ps.length;
  while (log.scrollHeight > log.clientHeight + 1 && last - 1 > c.logPage) { last -= 1; ps[last].hidden = true; }
  c.logMore = last < ps.length ? last : 0;

function battleNext() {

// Kenji-sensei helps three times per battle: a memory trick (and one wrong choice less) or +2 hearts.

// ---- karuta: Kenji reads a letter aloud; grab its card before Hana does (v16) ------------------------------------------
const KARUTA_ROUNDS = 10;
function startKaruta(back) {
  const pool = shuffle(taughtKana());

  const table = pool.splice(0, Math.min(8, pool.length));
  go({ type: "karuta", back: back || { type: "map" }, pool, table, round: 0, me: 0, rival: 0, target: "", phase: "read", lockUntil: 0, last: null });
  karutaRound();
}
function karutaRound() {
  const c = cur;
  if (c.type !== "karuta") return;
  if (c.round >= KARUTA_ROUNDS || !c.table.some(Boolean)) return karutaEnd();
  c.round += 1;
  const live = c.table.filter(Boolean);
  c.target = live[Math.floor(Math.random() * live.length)];
  c.phase = "read"; c.last = null;
  c.readAt = performance.now();

  render();

}
function karutaLoop(c) {

    requestAnimationFrame(step);

}

  const q = { qid: "kar", item_id: c.target, dir: "listen", word: false };
  if (id === c.target) { noteAnswer(q, true, ITEMS[id].romaji); save(); return karutaTake("me", i); }

}

  const c = cur;
  if (c.phase !== "ask") return;
  const w = WORD_BY_ID[c.fish.id], chosen = c.choices[i], ok = chosen === w.romaji;
  noteAnswer({ qid: "fish", item_id: w.id, word: true }, ok, chosen);
  if (ok) {
    S.fish[w.id] = (S.fish[w.id] || 0) + 1; S.mon += 5;
    learnWords([w.id], true);
    c.msg = t("fish_got", { ja: w.ja, r: w.romaji, m: L(w.meaning), mon: 5 }); c.res = { ok: true };
    sfx("chest"); speak(w.ja);
  } else {
    c.msg = t("fish_lost", { r: w.romaji, m: L(w.meaning) }); c.res = { ok: false, chosen };
    sfx("wrong");
  }
  c.phase = "done"; c.doneAt = performance.now();
  save();
  render();
}
function viewFishing() {
  const c = cur, spot = FISH_SPOTS[c.where] || FISH_SPOTS.river, w = c.fish ? WORD_BY_ID[c.fish.id] : null;
  const inWater = ["wait", "bite", "ask"].includes(c.phase);
  const bob = inWater ? `<span class="bobber${c.phase === "bite" ? " bite" : ""}" style="left:${spot.bobX}%;top:${spot.bobY}%"></span>${c.phase === "bite" ? `<span class="bite-mark" style="left:${spot.bobX}%;top:${spot.bobY}%">!</span>` : ""}` : "";
  // The rod in the hero's hands, and the line from its tip to the float.
  const handY = 100 - (spot.heroB + spot.heroH * 0.45), tipX = spot.hero + 9, tipY = handY - spot.heroH * 0.5;
  const line = `<svg class="fline" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path class="rod" d="M ${spot.hero + 2} ${handY} L ${tipX} ${tipY}" />${inWater ? `<path d="M ${tipX} ${tipY} Q ${(tipX + spot.bobX) / 2} ${Math.max(tipY, spot.bobY) + 6} ${spot.bobX} ${spot.bobY}" />` : ""}</svg>`;
  const jump = c.phase === "done" && c.res && c.res.ok && c.fish ? `<span class="fish-jump" style="left:${spot.bobX}%;top:${spot.bobY}%">${sprite(c.fish.sprite, 4, "")}</span>` : "";
  const extra = line + bob + jump;
  const all = FISH.filter((f) => f.where === c.where), got = all.filter((f) => S.fish[f.id]);
  const shelf = all.map((f) => `<span class="fshelf${S.fish[f.id] ? "" : " none"}" title="${esc(S.fish[f.id] ? WORD_BY_ID[f.id].ja : "?")}">${sprite(f.sprite, 2, "")}</span>`).join("");
  let body = `<p class="fmsg${c.res ? (c.res.ok ? " ok" : " bad") : ""}" aria-live="polite">${esc(c.msg)}</p>`;
  if (c.phase === "ask") body += `<div class="kana" lang="ja">${esc(w.ja)}</div><div class="choices">${c.choices.map((ch, i) => `<button class="btn choice" data-act="choose" data-i="${i}"><span class="key" aria-hidden="true">${i + 1}</span>${esc(ch)}</button>`).join("")}</div>`;
  const act = c.phase === "wait" || c.phase === "bite" ? `<button class="btn primary${c.phase === "bite" ? " pulse" : ""}" data-act="fish-pull" data-primary>${t("fish_pull")}</button>`
    : c.phase === "ready" || c.phase === "done" ? `<button class="btn primary" data-act="fish-cast" data-primary>${t("fish_cast")}</button>` : "";
  return `<div class="view v-fishing">
    ${stage(spot.scene, [{ sprite: "hero", x: spot.hero, cls: "idle-breathe fisher-hero" }], extra, c.where)}
    <section class="win f-panel"><h2>${t("fish_title")}</h2>${body}
      <div class="fshelf-row" aria-label="${esc(t("fish_caught", { n: got.length, N: all.length }))}"><span class="muted small">${t("fish_caught", { n: got.length, N: all.length })}</span><span class="fshelf-icons">${shelf}</span></div>
      <div class="row end"><button class="btn small ghost" data-act="mini-back" data-back>${t("leave")}</button>${act}</div></section>
  </div>`;
}
function startTest(kind, stepIndex) {
  let form;
  if (kind === "pre") form = Math.random() < 0.5 ? "A" : "B";
  else form = S.pretest.form === "A" ? "B" : S.pretest.form === "B" ? "A" : (Math.random() < 0.5 ? "A" : "B");
  const engine = new QuizEngine({});  // the tests never save their quiz state
  engine.start(FORM_POOLS[form]);
  go({ type: "test", kind, form, engine, stepIndex, phase: "intro", answered: 0, score: 0 });
}
function testBegin() { cur.phase = "ask"; cur.q = cur.engine.nextQuestion(); render(); }
function testAnswer(i) {
  const c = cur;
  if (c.phase !== "ask") return;
  const res = c.engine.submit(c.q.qid, c.q.choices[i]);
  if (!res) return;
  sfx("page");
  c.answered += 1;
  if (res.correct) c.score += 1;
  if (c.answered < N_TEST_ITEMS) { c.q = c.engine.nextQuestion(); return render(); }
  const result = { form: c.form, score: c.score };
  if (c.kind === "pre") {
    S.pretest = result;
    logEvent("pretest", { form: c.form, score: c.score, n_items: N_TEST_ITEMS });
    finishStep(c.stepIndex);
    c.phase = "done";
    return render();
  }
  S.posttest = result;
  const known = FORM_POOLS[S.pretest.form] !== undefined;
  logEvent("posttest", { form: c.form, score: c.score, n_items: N_TEST_ITEMS, pre_form: known ? S.pretest.form : "", pre_score: known ? S.pretest.score : -1 });
  advanceFrom(c.stepIndex);
}

screenEl.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || !screenEl.contains(el) || el.disabled) return;
  const act = ACTIONS[el.dataset.act];
  if (act) act(el);
});

document.addEventListener("keydown", (e) => {
  if (e.altKey || e.ctrlKey || e.metaKey) return;
  if (e.target.closest && e.target.closest("input, textarea")) {
    if (e.key === "Enter") { e.preventDefault(); if (e.target.id === "convo-input") ACTIONS["convo-check"](); else e.target.blur(); }
    return;
  }
  const onControl = e.target.closest && e.target.closest("button, summary, a, input");
  const key = e.key;
  if ((key === "f" || key === "F") && !e.repeat) { toggleFullscreen(); return; }
  // The menu: arrows move between its buttons, X or Esc closes it.
  if (cur.type === "map" && cur.menu) {
    if (key === "Escape" || key === "x" || key === "X" || ((key === "m" || key === "M") && cur.menu.tab !== "shop")) { e.preventDefault(); closeMenu(); return; }
    if (key === "ArrowDown" || key === "ArrowUp") {
      const items = [...document.querySelectorAll("#menu button:not([disabled])")];
      const i = items.indexOf(document.activeElement);
      const next = items[(i + (key === "ArrowDown" ? 1 : -1) + items.length) % items.length];
      if (next) { e.preventDefault(); next.focus(); }
    }
    return;
  }
  if (cur.type === "map") {
    if ((key === "Enter" || key === " ") && onControl) return;
    if (worldKeyDown(e)) return;
  }
  if (/^[1-8]$/.test(key) && cur.type === "karuta") {
    const btn = screenEl.querySelectorAll('[data-act="kar-pick"]')[parseInt(key, 10) - 1];
    if (btn && !btn.disabled) { e.preventDefault(); btn.click(); }
    return;
  }
  if (/^[1-4]$/.test(key) && cur.type === "convo") {
    const btn = screenEl.querySelectorAll('[data-act="convo-pick"]:not([disabled])')[parseInt(key, 10) - 1];
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  if (/^[1-4]$/.test(key)) {
    const btn = screenEl.querySelector(`[data-act="choose"][data-i="${parseInt(key, 10) - 1}"]:not([disabled])`);
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  // On a card, the arrow keys turn the pages.
  if ((key === "ArrowRight" || key === "ArrowLeft") && (cur.type === "card" || cur.type === "word" || cur.cards)) {
    const btn = screenEl.querySelector(key === "ArrowRight" ? "[data-primary]" : "[data-back]:not([disabled])");
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  if ((key === "Enter" || key === " ") && onControl) return;  // the focused control handles it
  if (key === "z" || key === "Z" || key === "Enter" || key === " ") {
    const btn = screenEl.querySelector("[data-primary]");
    if (btn) { e.preventDefault(); btn.click(); }
    return;
  }
  if (key === "x" || key === "X" || key === "Escape") {
    const btn = screenEl.querySelector("[data-back]:not([disabled])");
    if (btn) { e.preventDefault(); btn.click(); }
  }
});
document.addEventListener("keyup", (e) => { if (cur.type === "map") worldKeyUp(e); });

function boot(hot) {

window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
